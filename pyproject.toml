[project]
name = "m5-forecasting"
version = "0.0.1"
description = "MLOps with Nixtla on Databricks"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
                "databricks-feature-engineering==0.7.0",
                "databricks-feature-lookup==1.2.0",
                "databricks-sdk==0.32.0",
                "pydantic==2.9.2",
                "mlflow==2.17.0",
                "cffi==1.17.1",
                "cloudpickle==3.1.0",
                "matplotlib==3.9.2",
                "numpy==1.26.4",
                "pandas==1.5.3",
                "pandera[pyspark]==0.20.4",
                "psutil==6.1.0",
                "plotly==5.24.1",
                "pyarrow==14.0.1",
                "statsforecast[plotly]==1.7.8",
                "mlforecast[spark]==0.13.5",
                "coreforecast==0.0.13.1",
                "utilsforecast==0.2.7",    
                "lightgbm==4.5.0",
                "scipy==1.14.1",
                "scikit-learn==1.5.2",
                "synapse==2.187.0",
                "synapseml==1.0.8"
                ]

[project.optional-dependencies]
dev = ["databricks-connect>=15.4.1, <16",
       "ipykernel>=6.29.5, <7",
       "pip>=24.2",
       "pre-commit>=3.4.0, <4"
       ]

[tool.ruff]
line-length = 120
lint.select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
]
lint.ignore = [
    "E501",  # line-too-long
]

[tool.ruff.format]
indent-style = "space"

[tool.setuptools]
packages = ["m5_forecasting"]

[tool.setuptools.package-data]
m5_forecasting = ["**/*.py"]

[build-system]
requires = [
  "setuptools>=72.0"]
build-backend = "setuptools.build_meta" 